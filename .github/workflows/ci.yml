name: Integración Continua Básica (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-backend:
    name: Compilar Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto con Maven
        working-directory: ./src/backend
        run: mvn clean compile -DskipTests

  build-frontend:
    name: Compilar Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: ./src/frontend
        run: npm install

      - name: Construir proyecto React (Build)
        working-directory: ./src/frontend
        run: npm run build
